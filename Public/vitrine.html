
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Divulgador Inteligente</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
    --laranja: #ee4d2d;
    --laranja-escuro: #d83e20;
    --fundo: #f5f5f5;
    --texto: #252525;
    --borda: #e9e9e9;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font-family: Arial, Helvetica, sans-serif;
    padding-bottom: 35px;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    opacity: 0.55;
    cursor: wait;
}

[hidden] {
    display: none !important;
}

/* CABEÇALHO */

.topo {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--laranja);
    padding: 15px 13px;
    color: white;
    box-shadow: 0 2px 8px #00000012;
}

.topo-conteudo {
    max-width: 1100px;
    margin: auto;
}

.marca {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 15px;
}

.logo {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: #ffffff30;
    font-size: 27px;
}

.marca h1 {
    font-size: 19px;
    margin: 0 0 5px;
}

.marca p {
    font-size: 12px;
    margin: 0;
    opacity: 0.95;
}

.busca-area {
    position: relative;
}

.busca {
    display: flex;
    gap: 5px;
    padding: 5px;
    background: white;
    border-radius: 12px;
}

.busca input {
    min-width: 0;
    flex: 1;
    border: 0;
    outline: 0;
    padding: 12px 9px;
    font-size: 15px;
    color: #222;
}

.busca button,
.primario {
    border: 0;
    border-radius: 9px;
    background: var(--laranja);
    color: white;
    font-weight: bold;
    padding: 12px 15px;
}

.sugestoes {
    position: absolute;
    top: calc(100% + 5px);
    left: 0;
    right: 0;
    z-index: 40;
    background: white;
    color: #333;
    border-radius: 10px;
    box-shadow: 0 5px 20px #00000030;
    overflow: hidden;
}

.sugestao {
    display: block;
    width: 100%;
    padding: 13px;
    text-align: left;
    background: white;
    border: 0;
    border-bottom: 1px solid #eee;
}

/* SEÇÕES */

main {
    max-width: 1100px;
    margin: auto;
}

.secao {
    margin: 13px 10px;
    background: white;
    border-radius: 13px;
    overflow: hidden;
}

.secao-cabecalho {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 15px 12px;
}

.secao-cabecalho h2 {
    font-size: 17px;
    margin: 0;
}

.ver-tudo {
    border: 0;
    background: none;
    color: var(--laranja);
    font-size: 12px;
    white-space: nowrap;
}

.faixa-laranja {
    background: linear-gradient(
        100deg,
        #ff683a,
        #ee4d2d
    );
    color: white;
}

.faixa-laranja .ver-tudo {
    color: white;
}

/* CATEGORIAS */

.categorias {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 13px 5px;
    padding: 8px 9px 20px;
}

.categoria {
    border: 0;
    background: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    line-height: 1.3;
    color: #333;
}

.categoria-icone {
    width: 57px;
    height: 57px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #f2f3f6;
    font-size: 28px;
}

/* PRODUTOS */

.grade {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    padding: 0 10px 12px;
}

.horizontal {
    display: flex;
    overflow-x: auto;
    gap: 10px;
    padding: 0 10px 13px;
    scrollbar-width: thin;
}

.horizontal .produto {
    flex: 0 0 165px;
}

.produto {
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--borda);
    border-radius: 11px;
    background: white;
}

.foto {
    width: 100%;
    aspect-ratio: 1;
    object-fit: contain;
    background: white;
}

.produto-corpo {
    padding: 9px;
    display: flex;
    flex-direction: column;
    flex: 1;
    gap: 7px;
}

.nome {
    font-size: 12px;
    line-height: 1.4;
    min-height: 34px;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
}

.loja {
    font-size: 11px;
    color: #777;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.preco {
    font-size: 18px;
    color: var(--laranja);
    font-weight: bold;
}

.detalhes {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 4px;
    font-size: 10px;
    color: #777;
}

.acoes {
    display: grid;
    gap: 6px;
    margin-top: auto;
}

.arte,
.shopee {
    border-radius: 8px;
    padding: 10px 4px;
    font-size: 12px;
    font-weight: bold;
}

.arte {
    background: var(--laranja);
    border: 1px solid var(--laranja);
    color: white;
}

.shopee {
    background: white;
    border: 1px solid var(--laranja);
    color: var(--laranja);
}

/* MENSAGENS */

.vazio {
    text-align: center;
    padding: 35px 15px;
    color: #777;
    line-height: 1.5;
}

.carregando {
    text-align: center;
    padding: 20px;
    color: #777;
    font-size: 13px;
}

/* PESQUISA */

.ordenacoes {
    display: flex;
    overflow-x: auto;
    background: white;
    border-bottom: 1px solid #eee;
    scrollbar-width: none;
}

.ordenacao {
    flex-shrink: 0;
    border: 0;
    border-bottom: 3px solid transparent;
    background: white;
    padding: 14px 13px;
    white-space: nowrap;
    font-size: 13px;
}

.ordenacao.ativa {
    color: var(--laranja);
    border-bottom-color: var(--laranja);
    font-weight: bold;
}

.filtros-rapidos {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px;
    background: white;
}

.chip {
    flex-shrink: 0;
    border: 1px solid #e8e8e8;
    border-radius: 9px;
    background: #fafafa;
    padding: 10px;
    font-size: 12px;
}

.chip.ativo {
    color: var(--laranja);
    border-color: var(--laranja);
    background: #fff2ee;
}

.voltar {
    margin: 12px;
    padding: 10px 13px;
    border: 1px solid var(--laranja);
    border-radius: 9px;
    color: var(--laranja);
    background: white;
}

/* PAINEL DE FILTROS */

.painel-fundo {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: #0008;
    display: flex;
    align-items: flex-end;
}

.painel {
    width: 100%;
    max-height: 85vh;
    overflow: auto;
    background: white;
    padding: 20px 20px calc(
        20px + env(safe-area-inset-bottom)
    );
    border-radius: 19px 19px 0 0;
}

.painel-topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.painel-topo h2 {
    margin: 0;
}

.fechar {
    border: 0;
    background: #eee;
    border-radius: 50%;
    width: 35px;
    height: 35px;
    font-size: 20px;
}

.precos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 13px 0 20px;
}

.precos input {
    min-width: 0;
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 9px;
    padding: 12px;
}

.painel-acoes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 25px;
}

.painel-acoes button {
    padding: 14px 8px;
    border-radius: 9px;
}

/* AVISOS */

.aviso {
    position: fixed;
    z-index: 90;
    bottom: 20px;
    left: 15px;
    right: 15px;
    padding: 15px;
    background: #263238;
    color: white;
    text-align: center;
    border-radius: 11px;
    box-shadow: 0 5px 20px #0003;
    font-size: 13px;
}

/* TELAS MAIORES */

@media (min-width: 750px) {
    .categorias {
        grid-template-columns: repeat(8, 1fr);
    }

    .grade {
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .painel {
        max-width: 500px;
        margin: auto;
    }
}
</style>
</head>

<body>

<header class="topo">
    <div class="topo-conteudo">
        <div class="marca">
            <div class="logo">🛍️</div>

            <div>
                <h1>Divulgador Inteligente 🤖</h1>
                <p>
                    Pesquise, selecione e divulgue produtos
                </p>
            </div>
        </div>

        <div class="busca-area">
            <form class="busca" id="formBusca">
                <input
                    id="campoBusca"
                    type="search"
                    placeholder="O que você procura?"
                    maxlength="120"
                    autocomplete="off"
                >

                <button type="submit">
                    Buscar
                </button>
            </form>

            <div
                class="sugestoes"
                id="sugestoes"
                hidden
            ></div>
        </div>
    </div>
</header>

<main>

    <!-- PÁGINA INICIAL -->

    <div id="paginaInicial">

        <!-- CATEGORIAS -->

        <section class="secao">
            <div class="secao-cabecalho">
                <h2>🛍️ Categorias</h2>
            </div>

            <div
                class="categorias"
                id="categorias"
            ></div>
        </section>

        <!-- DESTAQUES PARA VOCÊ -->

        <section class="secao">
            <div class="secao-cabecalho faixa-laranja">
                <h2>⭐ Destaques para você</h2>

                <button
                    class="ver-tudo"
                    data-busca="destaques"
                >
                    Ver tudo ›
                </button>
            </div>

            <div
                class="horizontal"
                id="destaques"
            ></div>

            <div
                class="carregando"
                id="loadingDestaques"
            >
                🔄 Carregando destaques...
            </div>
        </section>

        <!-- DESCOBERTAS DO DIA -->

        <section class="secao">
            <div class="secao-cabecalho">
                <h2>🔥 Descobertas do dia</h2>

                <button
                    class="ver-tudo"
                    data-busca="descobertas"
                >
                    Ver tudo ›
                </button>
            </div>

            <div
                class="grade"
                id="descobertas"
            ></div>

            <div
                class="carregando"
                id="loadingDescobertas"
            >
                🔄 Carregando produtos...
            </div>
        </section>

    </div>

    <!-- RESULTADOS DA PESQUISA -->

    <div id="paginaPesquisa" hidden>

        <button
            class="voltar"
            id="voltarInicio"
        >
            ← Voltar ao início
        </button>

        <nav class="ordenacoes">
            <button
                class="ordenacao ativa"
                data-ordem="relevancia"
            >
                Relevância
            </button>

            <button
                class="ordenacao"
                data-ordem="maisVendidos"
            >
                Mais vendidos
            </button>

            <button
                class="ordenacao"
                data-ordem="menorPreco"
            >
                Menor preço
            </button>

            <button
                class="ordenacao"
                data-ordem="maiorPreco"
            >
                Maior preço
            </button>

            <button
                class="ordenacao"
                data-ordem="maiorComissao"
            >
                Maior comissão
            </button>
        </nav>

        <div class="filtros-rapidos">
            <button
                class="chip"
                id="abrirFiltros"
            >
                ☰ Filtros
            </button>

            <button
                class="chip"
                id="chipOficiais"
            >
                🏬 Lojas oficiais
            </button>

            <button
                class="chip"
                id="chipPreco"
            >
                💰 Faixa de preço
            </button>

            <button
                class="chip"
                id="limparRapido"
                hidden
            >
                ✕ Limpar
            </button>
        </div>

        <section class="secao">
            <div class="secao-cabecalho">
                <h2 id="tituloResultados">
                    Resultados
                </h2>

                <span
                    id="contador"
                    style="font-size:12px;color:#888"
                >
                    0 exibidos
                </span>
            </div>

            <div
                class="grade"
                id="gradePesquisa"
            ></div>

            <div
                class="vazio"
                id="mensagemPesquisa"
                hidden
            ></div>

            <div
                class="carregando"
                id="loadingPesquisa"
                hidden
            >
                🔄 Carregando produtos...
            </div>

            <div id="sentinela"></div>
        </section>

    </div>

</main>

<!-- PAINEL DE FILTROS -->

<div
    class="painel-fundo"
    id="fundoFiltros"
    hidden
>
    <div
        class="painel"
        role="dialog"
        aria-modal="true"
        aria-label="Filtros de produtos"
    >
        <div class="painel-topo">
            <h2>☰ Filtros</h2>

            <button
                class="fechar"
                id="fecharFiltros"
            >
                ×
            </button>
        </div>

        <p>Faixa de preço</p>

        <div class="precos">
            <input
                id="precoMinimo"
                type="number"
                min="0"
                step="0.01"
                placeholder="R$ mínimo"
            >

            <input
                id="precoMaximo"
                type="number"
                min="0"
                step="0.01"
                placeholder="R$ máximo"
            >
        </div>

        <label>
            <input
                id="somenteOficiais"
                type="checkbox"
            >

            Somente lojas oficiais
        </label>

        <div class="painel-acoes">
            <button id="limparFiltros">
                Limpar
            </button>

            <button
                class="primario"
                id="aplicarFiltros"
            >
                Aplicar filtros
            </button>
        </div>
    </div>
</div>

<div
    class="aviso"
    id="aviso"
    hidden
></div>

<script>
"use strict";

// ==========================================
// TELEGRAM
// ==========================================

const tg = window.Telegram?.WebApp;

tg?.ready();
tg?.expand();

const initData = tg?.initData || "";

const $ = id =>
    document.getElementById(id);

// ==========================================
// CATEGORIAS
// ==========================================

const categorias = [
    ["🎮", "Games", "console playstation xbox"],
    ["📱", "Celulares", "smartphone"],
    ["💻", "Informática", "notebook computador"],
    ["📺", "Eletrônicos", "smart tv"],
    ["🏠", "Eletrodomésticos", "air fryer"],
    ["👗", "Moda feminina", "vestido feminino"],
    ["👕", "Moda masculina", "camiseta masculina"],
    ["👟", "Calçados", "tenis"],
    ["🎧", "Áudio", "fone bluetooth"],
    ["💄", "Beleza", "kit maquiagem"],
    ["🧸", "Brinquedos", "brinquedos"],
    ["🚲", "Esportes", "bicicleta"]
];

// ==========================================
// PESQUISAS DA PÁGINA INICIAL
// ==========================================

const pesquisasInicio = {
    destaques: "playstation 5",
    descobertas: "eletronicos"
};

// ==========================================
// ESTADO DA PESQUISA
// ==========================================

const estado = {
    termo: "",
    ordem: "relevancia",

    precoMinimo: null,
    precoMaximo: null,
    oficiais: false,

    pagina: 1,
    limite: 20,

    carregando: false,
    temMais: false,

    quantidade: 0,
    versao: 0,
    controlador: null
};

let avisoTimer;
let arteEmAndamento = false;

// ==========================================
// AVISOS
// ==========================================

function avisar(mensagem) {
    clearTimeout(avisoTimer);

    $("aviso").textContent = mensagem;
    $("aviso").hidden = false;

    avisoTimer = setTimeout(() => {
        $("aviso").hidden = true;
    }, 4500);
}

function mostrarErro(elemento, mensagem) {
    elemento.textContent = mensagem;
    elemento.hidden = false;
}

// ==========================================
// CONSULTAR A API
// ==========================================

async function consultarProdutos(
    termo,
    pagina = 1,
    limite = 20,
    ordem = "relevancia",
    filtros = {},
    signal
) {
    if (!initData) {
        throw new Error(
            "Abra a vitrine pelo botão do bot no Telegram."
        );
    }

    const params = new URLSearchParams({
        termo,
        page: String(pagina),
        limit: String(limite),
        ordenacao: ordem,
        somenteOficiais: String(
            filtros.oficiais === true
        )
    });

    if (filtros.minimo != null) {
        params.set(
            "precoMinimo",
            String(filtros.minimo)
        );
    }

    if (filtros.maximo != null) {
        params.set(
            "precoMaximo",
            String(filtros.maximo)
        );
    }

    const resposta = await fetch(
        "/api/produtos?" + params.toString(),
        {
            headers: {
                "X-Telegram-Init-Data": initData
            },
            signal
        }
    );

    const dados = await resposta.json();

    if (!resposta.ok) {
        throw new Error(
            dados.erro ||
            "Erro ao buscar produtos."
        );
    }

    return dados;
}

// ==========================================
// CRIAR ELEMENTOS
// ==========================================

function criar(tag, classe, texto) {
    const elemento =
        document.createElement(tag);

    if (classe) {
        elemento.className = classe;
    }

    if (texto != null) {
        elemento.textContent = texto;
    }

    return elemento;
}

// ==========================================
// FORMATAR VENDAS
// ==========================================

function formatarVendas(valor) {
    const numero = Number(valor);

    if (
        !Number.isFinite(numero) ||
        numero <= 0
    ) {
        return "";
    }

    if (numero >= 1000) {
        return (
            (numero / 1000).toLocaleString(
                "pt-BR",
                {
                    maximumFractionDigits: 1
                }
            ) +
            " mil vendidos"
        );
    }

    return (
        numero.toLocaleString("pt-BR") +
        " vendidos"
    );
}

// ==========================================
// CRIAR CARTÃO DO PRODUTO
// ==========================================

function criarCartao(produto) {
    const cartao =
        criar("article", "produto");

    const foto =
        criar("img", "foto");

    foto.alt =
        produto.titulo || "Produto";

    foto.loading = "lazy";

    if (
        typeof produto.imagem === "string" &&
        /^https:\/\//i.test(produto.imagem)
    ) {
        foto.src = produto.imagem;
    }

    const corpo =
        criar("div", "produto-corpo");

    const nome =
        criar(
            "div",
            "nome",
            produto.titulo || "Produto"
        );

    const loja =
        criar(
            "div",
            "loja",
            produto.loja || "Loja Shopee"
        );

    const preco =
        criar(
            "div",
            "preco",
            produto.preco || ""
        );

    const detalhes =
        criar("div", "detalhes");

    const nota =
        Number(produto.avaliacao);

    if (
        Number.isFinite(nota) &&
        nota > 0
    ) {
        detalhes.append(
            criar(
                "span",
                "",
                `⭐ ${nota.toFixed(1)}`
            )
        );
    }

    const vendas =
        formatarVendas(produto.vendas);

    if (vendas) {
        detalhes.append(
            criar("span", "", vendas)
        );
    }

    const acoes =
        criar("div", "acoes");

    // BOTÃO GERAR ARTE

    const btnArte =
        criar(
            "button",
            "arte",
            "🎨 Gerar arte"
        );

    btnArte.addEventListener(
        "click",
        () => solicitarArte(
            produto,
            btnArte
        )
    );

    // BOTÃO VER NA SHOPEE

    const btnShopee =
        criar(
            "button",
            "shopee",
            "🛍️ Ver na Shopee"
        );

    const link =
        produto.linkAfiliado;

    btnShopee.disabled = !(
        typeof link === "string" &&
        /^https:\/\//i.test(link)
    );

    btnShopee.addEventListener(
        "click",
        () => {
            if (btnShopee.disabled) {
                return;
            }

            if (tg?.openLink) {
                tg.openLink(link);
            } else {
                window.open(
                    link,
                    "_blank",
                    "noopener,noreferrer"
                );
            }
        }
    );

    acoes.append(
        btnArte,
        btnShopee
    );

    corpo.append(
        nome,
        loja,
        preco,
        detalhes,
        acoes
    );

    cartao.append(
        foto,
        corpo
    );

    return cartao;
}

// ==========================================
// SOLICITAR GERAÇÃO DA ARTE
// ==========================================

async function solicitarArte(
    produto,
    botao
) {
    if (arteEmAndamento) {
        avisar(
            "Aguarde a solicitação anterior terminar."
        );

        return;
    }

    arteEmAndamento = true;
    botao.disabled = true;

    const textoOriginal =
        botao.textContent;

    botao.textContent =
        "🔄 Solicitando...";

    try {
        const resposta = await fetch(
            "/api/gerar-arte",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "X-Telegram-Init-Data":
                        initData
                },

                body: JSON.stringify({
                    shopId:
                        produto.shopId,

                    itemId:
                        produto.itemId
                })
            }
        );

        const dados =
            await resposta.json();

        if (!resposta.ok) {
            throw new Error(
                dados.erro ||
                "Erro ao solicitar arte."
            );
        }

        avisar(
            "✅ Arte solicitada! Confira a conversa com o bot."
        );

        botao.textContent =
            "✅ Solicitada";

    } catch (erro) {
        avisar(
            "❌ " + erro.message
        );

    } finally {
        arteEmAndamento = false;

        setTimeout(() => {
            botao.disabled = false;

            botao.textContent =
                textoOriginal;
        }, 2500);
    }
}

// ==========================================
// MONTAR CATEGORIAS
// ==========================================

function montarCategorias() {
    const destino =
        $("categorias");

    destino.replaceChildren();

    for (
        const [
            icone,
            nome,
            termo
        ] of categorias
    ) {
        const botao =
            criar(
                "button",
                "categoria"
            );

        const simbolo =
            criar(
                "span",
                "categoria-icone",
                icone
            );

        const texto =
            criar(
                "span",
                "",
                nome
            );

        botao.append(
            simbolo,
            texto
        );

        botao.addEventListener(
            "click",
            () => iniciarPesquisa(termo)
        );

        destino.append(botao);
    }
}

// ==========================================
// CARREGAR UMA SEÇÃO DA PÁGINA INICIAL
// ==========================================

async function carregarSecao(
    id,
    loadingId,
    termo,
    limite,
    ordem
) {
    const destino = $(id);
    const loading = $(loadingId);

    destino.replaceChildren();
    loading.hidden = false;

    try {
        const dados =
            await consultarProdutos(
                termo,
                1,
                limite,
                ordem
            );

        const produtos =
            dados.produtos || [];

        if (!produtos.length) {
            destino.append(
                criar(
                    "div",
                    "vazio",
                    "Nenhum produto disponível nesta seção."
                )
            );

            return;
        }

        const fragmento =
            document.createDocumentFragment();

        for (
            const produto of produtos
        ) {
            fragmento.append(
                criarCartao(produto)
            );
        }

        destino.append(fragmento);

    } catch (erro) {
        destino.append(
            criar(
                "div",
                "vazio",
                erro.message
            )
        );

    } finally {
        loading.hidden = true;
    }
}

// ==========================================
// CARREGAR PÁGINA INICIAL
// ==========================================

function carregarInicio() {
    montarCategorias();

    // DESTAQUES PARA VOCÊ

    carregarSecao(
        "destaques",
        "loadingDestaques",
        pesquisasInicio.destaques,
        12,
        "relevancia"
    );

    // DESCOBERTAS DO DIA

    carregarSecao(
        "descobertas",
        "loadingDescobertas",
        pesquisasInicio.descobertas,
        20,
        "maisVendidos"
    );
}

// ==========================================
// MOSTRAR PÁGINA INICIAL
// ==========================================

function mostrarInicio() {
    estado.controlador?.abort();

    estado.versao++;
    estado.carregando = false;

    $("paginaInicial").hidden =
        false;

    $("paginaPesquisa").hidden =
        true;

    $("campoBusca").value = "";

    $("sugestoes").hidden = true;

    window.scrollTo(0, 0);
}

// ==========================================
// ORDENAÇÃO
// ==========================================

function atualizarOrdenacao() {
    document
        .querySelectorAll(".ordenacao")
        .forEach(botao => {
            botao.classList.toggle(
                "ativa",
                botao.dataset.ordem ===
                    estado.ordem
            );
        });
}

// ==========================================
// INICIAR PESQUISA
// ==========================================

function iniciarPesquisa(termo) {
    termo =
        String(termo || "").trim();

    if (!termo) {
        avisar(
            "Digite o nome de um produto."
        );

        return;
    }

    estado.controlador?.abort();

    estado.versao++;

    estado.termo = termo;
    estado.pagina = 1;
    estado.quantidade = 0;

    estado.temMais = true;
    estado.carregando = false;

    $("campoBusca").value =
        termo;

    $("sugestoes").hidden =
        true;

    $("paginaInicial").hidden =
        true;

    $("paginaPesquisa").hidden =
        false;

    $("tituloResultados").textContent =
        "Resultados para: " + termo;

    $("contador").textContent =
        "0 exibidos";

    $("gradePesquisa").replaceChildren();

    $("mensagemPesquisa").hidden =
        true;

    atualizarOrdenacao();

    window.scrollTo(0, 0);

    carregarMais();
}

// ==========================================
// CARREGAR MAIS PRODUTOS
// ==========================================

async function carregarMais() {
    if (
        estado.carregando ||
        !estado.temMais ||
        $("paginaPesquisa").hidden
    ) {
        return;
    }

    const versao =
        estado.versao;

    const controlador =
        new AbortController();

    estado.controlador =
        controlador;

    estado.carregando =
        true;

    $("loadingPesquisa").hidden =
        false;

    try {
        const dados =
            await consultarProdutos(
                estado.termo,
                estado.pagina,
                estado.limite,
                estado.ordem,

                {
                    minimo:
                        estado.precoMinimo,

                    maximo:
                        estado.precoMaximo,

                    oficiais:
                        estado.oficiais
                },

                controlador.signal
            );

        if (
            versao !== estado.versao
        ) {
            return;
        }

        const produtos =
            dados.produtos || [];

        const fragmento =
            document.createDocumentFragment();

        for (
            const produto of produtos
        ) {
            fragmento.append(
                criarCartao(produto)
            );
        }

        $("gradePesquisa").append(
            fragmento
        );

        estado.quantidade +=
            produtos.length;

        estado.temMais =
            dados.pageInfo?.hasNextPage ===
            true;

        estado.pagina++;

        $("contador").textContent =
            estado.quantidade +
            " exibidos";

        if (
            estado.quantidade === 0 &&
            !estado.temMais
        ) {
            mostrarErro(
                $("mensagemPesquisa"),

                "Nenhum produto encontrado. Tente outras palavras ou remova os filtros."
            );
        }

    } catch (erro) {
        if (
            erro.name === "AbortError"
        ) {
            return;
        }

        if (
            versao !== estado.versao
        ) {
            return;
        }

        estado.temMais = false;

        mostrarErro(
            $("mensagemPesquisa"),
            "❌ " + erro.message
        );

    } finally {
        if (
            versao === estado.versao
        ) {
            estado.carregando =
                false;

            $("loadingPesquisa").hidden =
                true;
        }
    }
}

// ==========================================
// ROLAGEM INFINITA
// ==========================================

const observador =
    new IntersectionObserver(
        entradas => {
            if (
                entradas.some(
                    entrada =>
                        entrada.isIntersecting
                ) &&
                !estado.carregando &&
                estado.temMais
            ) {
                carregarMais();
            }
        },

        {
            rootMargin: "400px"
        }
    );

observador.observe(
    $("sentinela")
);

// ==========================================
// BOTÕES DE ORDENAÇÃO
// ==========================================

document
    .querySelectorAll(".ordenacao")
    .forEach(botao => {
        botao.addEventListener(
            "click",
            () => {
                if (
                    estado.ordem ===
                    botao.dataset.ordem
                ) {
                    return;
                }

                estado.ordem =
                    botao.dataset.ordem;

                iniciarPesquisa(
                    estado.termo
                );
            }
        );
    });

// ==========================================
// FILTROS
// ==========================================

function atualizarChips() {
    $("chipOficiais")
        .classList.toggle(
            "ativo",
            estado.oficiais
        );

    const temPreco =
        estado.precoMinimo !== null ||
        estado.precoMaximo !== null;

    $("chipPreco")
        .classList.toggle(
            "ativo",
            temPreco
        );

    $("limparRapido").hidden =
        !temPreco &&
        !estado.oficiais;
}

function abrirFiltros() {
    $("precoMinimo").value =
        estado.precoMinimo ?? "";

    $("precoMaximo").value =
        estado.precoMaximo ?? "";

    $("somenteOficiais").checked =
        estado.oficiais;

    $("fundoFiltros").hidden =
        false;
}

function fecharFiltros() {
    $("fundoFiltros").hidden =
        true;
}

function limparFiltros() {
    estado.precoMinimo = null;
    estado.precoMaximo = null;
    estado.oficiais = false;

    fecharFiltros();
    atualizarChips();

    if (estado.termo) {
        iniciarPesquisa(
            estado.termo
        );
    }
}

$("abrirFiltros").onclick =
    abrirFiltros;

$("chipPreco").onclick =
    abrirFiltros;

$("fecharFiltros").onclick =
    fecharFiltros;

$("limparFiltros").onclick =
    limparFiltros;

$("limparRapido").onclick =
    limparFiltros;

$("chipOficiais").onclick = () => {
    estado.oficiais =
        !estado.oficiais;

    atualizarChips();

    iniciarPesquisa(
        estado.termo
    );
};

$("fundoFiltros").addEventListener(
    "click",
    evento => {
        if (
            evento.target ===
            $("fundoFiltros")
        ) {
            fecharFiltros();
        }
    }
);

$("aplicarFiltros").onclick = () => {
    const textoMin =
        $("precoMinimo").value;

    const textoMax =
        $("precoMaximo").value;

    const minimo =
        textoMin === ""
            ? null
            : Number(textoMin);

    const maximo =
        textoMax === ""
            ? null
            : Number(textoMax);

    if (
        (
            minimo !== null &&
            (
                !Number.isFinite(minimo) ||
                minimo < 0
            )
        ) ||
        (
            maximo !== null &&
            (
                !Number.isFinite(maximo) ||
                maximo < 0
            )
        ) ||
        (
            minimo !== null &&
            maximo !== null &&
            minimo > maximo
        )
    ) {
        avisar(
            "Informe uma faixa de preço válida."
        );

        return;
    }

    estado.precoMinimo =
        minimo;

    estado.precoMaximo =
        maximo;

    estado.oficiais =
        $("somenteOficiais").checked;

    fecharFiltros();
    atualizarChips();

    iniciarPesquisa(
        estado.termo
    );
};

// ==========================================
// SUGESTÕES DE PESQUISA
// ==========================================

// Sugestões locais, não oficiais da Shopee.

const sugestoesBase = [
    "PlayStation 5",
    "PlayStation 5 Slim",
    "PlayStation 5 Pro",
    "PlayStation 5 Digital",
    "Controle PlayStation 5",
    "Xbox Series S",
    "Nintendo Switch",
    "iPhone",
    "Samsung Galaxy",
    "Smart TV",
    "Notebook Gamer",
    "Fone Bluetooth",
    "Air Fryer"
];

$("campoBusca").addEventListener(
    "input",
    () => {
        const termo =
            $("campoBusca")
                .value
                .trim()
                .toLowerCase();

        const destino =
            $("sugestoes");

        destino.replaceChildren();

        if (
            termo.length < 2
        ) {
            destino.hidden = true;

            return;
        }

        const lista =
            sugestoesBase
                .filter(sugestao =>
                    sugestao
                        .toLowerCase()
                        .includes(termo)
                )
                .slice(0, 6);

        for (
            const sugestao of lista
        ) {
            const botao =
                criar(
                    "button",
                    "sugestao",
                    "🔎 " + sugestao
                );

            botao.onclick = () => {
                iniciarPesquisa(
                    sugestao
                );
            };

            destino.append(botao);
        }

        destino.hidden =
            lista.length === 0;
    }
);

document.addEventListener(
    "click",
    evento => {
        if (
            !evento.target.closest(
                ".busca-area"
            )
        ) {
            $("sugestoes").hidden =
                true;
        }
    }
);

// ==========================================
// FORMULÁRIO DE PESQUISA
// ==========================================

$("formBusca").addEventListener(
    "submit",
    evento => {
        evento.preventDefault();

        iniciarPesquisa(
            $("campoBusca").value
        );

        $("campoBusca").blur();
    }
);

// ==========================================
// NAVEGAÇÃO
// ==========================================

$("voltarInicio").onclick =
    mostrarInicio;

document
    .querySelectorAll("[data-busca]")
    .forEach(botao => {
        botao.addEventListener(
            "click",
            () => {
                iniciarPesquisa(
                    pesquisasInicio[
                        botao.dataset.busca
                    ]
                );
            }
        );
    });

// ==========================================
// INICIALIZAÇÃO
// ==========================================

const termoInicial =
    new URLSearchParams(
        location.search
    ).get("termo");

atualizarChips();
atualizarOrdenacao();

if (termoInicial) {
    iniciarPesquisa(
        termoInicial
    );
} else {
    carregarInicio();
}

if (!initData) {
    avisar(
        "Abra a vitrine pelo botão do bot no Telegram."
    );
}
</script>
